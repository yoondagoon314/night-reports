[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maison-night-reports"
version = "0.1.0"
description = "Local PDF validation and reviewed Outlook drafts for Maison Sofia"
requires-python = ">=3.11"
dependencies = ["pypdf==6.10.0", "pywin32==311; sys_platform == 'win32'"]

[project.gui-scripts]
maison-night-reports = "night_reports.gui:main"

[tool.setuptools.packages.find]
include = ["night_reports*"]
